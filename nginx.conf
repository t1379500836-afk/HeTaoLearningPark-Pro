server {
    listen 8080;
    listen 80;
    server_name www.he-tao-learning-park001.xyz;
    include /www/server/panel/vhost/nginx/extension/hetao.test/*.conf;

    # === 学生端 ===
    location / {
        root /www/wwwroot/hetao/user/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 学生端 index.html：绝对禁止缓存
    location = /index.html {
        root /www/wwwroot/hetao/user/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 学生端静态资源：永久缓存
    location /assets/ {
        alias /www/wwwroot/hetao/user/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # === 管理后台 ===
    location /admin {
        alias /www/wwwroot/hetao/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 管理后台 index.html：绝对禁止缓存
    location = /admin/index.html {
        alias /www/wwwroot/hetao/admin/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 管理后台静态资源：永久缓存
    location /admin/assets/ {
        alias /www/wwwroot/hetao/admin/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # === API ===
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    access_log /www/wwwlogs/hetao.log;
    error_log /www/wwwlogs/hetao.error.log;
}

# === 非www域名跳转 ===
server {
    listen 8080;
    listen 80;
    server_name he-tao-learning-park001.xyz;
    return 301 http://www.he-tao-learning-park001.xyz$request_uri;
}
